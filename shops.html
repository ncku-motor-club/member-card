<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://tile.openstreetmap.org">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<title>成大機動車研究社 地圖</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb" crossorigin="anonymous">
<style>
  :root {
    --bg: #0e0f12; --panel: #17191e; --text: #f2f2f2; --muted: #9aa0a8;
    --accent: #ffb400; --landmark: #4ea1ff; --line: #2a2d34;
    color-scheme: dark; accent-color: var(--accent);
    --nav-h: 54px; --nav-gap: max(12px, env(safe-area-inset-bottom)); --nav-space: calc(var(--nav-h) + var(--nav-gap) + 12px);
    --spring: linear(0, 0.3 8%, 0.8 18%, 1.03 30%, 1.02 40%, 0.995 55%, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh;
    font-family: system-ui, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  #stage { position: relative; flex: 1; min-height: 0; }
  #map, #list { position: absolute; inset: 0; }
  #list { overflow-y: auto; overscroll-behavior: contain; padding: 14px 12px calc(var(--nav-space) + 8px); }
  [hidden] { display: none !important; }
  .visually-hidden:where(:not(:focus-within, :active)) {
    position: absolute !important; clip-path: inset(50%) !important; overflow: hidden !important; width: 1px !important; height: 1px !important;
    margin: -1px !important; padding: 0 !important; border: 0 !important; white-space: nowrap !important;
  }

  #note { position: absolute; top: 8px; left: 8px; right: 8px; z-index: 1100; padding: 8px 12px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 13px; text-align: center; }
  #state { position: absolute; inset: 0; z-index: 1050; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 24px; text-align: center; background: var(--bg); color: var(--muted); line-height: 1.7; }
  button, .btn { font: inherit; cursor: pointer; }
  .btn { display: inline-block; padding: 11px 16px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent);
    color: #111; font-weight: 700; font-size: 15px; text-decoration: none; text-align: center; }
  .btn.ghost { background: transparent; color: var(--text); border-color: var(--line); font-weight: 500; }

  /* 浮動玻璃導覽列：半透明底加模糊、內側高光、彈性滑動的指示膠囊 */
  nav { position: fixed; z-index: 1200; inset-inline: 0; inset-block-end: var(--nav-gap); display: flex; justify-content: center; pointer-events: none; }
  .glass, #sheet {
    --glass-a: .7;
    background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,0) 55%), rgba(24, 26, 31, var(--glass-a));
    -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%);
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(255,255,255,.06), 0 8px 24px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.25);
  }
  .glass { pointer-events: auto; position: relative; isolation: isolate; display: grid; grid-template-columns: 1fr 1fr; inline-size: min(200px, calc(100% - 32px)); padding: 4px; border-radius: 999px; }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass, #sheet { background: var(--panel); } }
  @media (prefers-reduced-transparency: reduce) { .glass, #sheet { background: var(--panel); -webkit-backdrop-filter: none; backdrop-filter: none; } }
  .glass a {
    position: relative; min-block-size: 44px; min-inline-size: 44px; padding: 0; border-radius: 999px; scale: 1;
    color: rgba(255,255,255,.78); font-size: 12px; font-weight: 600; text-decoration: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .glass a svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .glass a[aria-current="page"] { color: #fff; }
  .glass a[aria-current="page"] svg { color: var(--accent); }
  .glass a:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }
  /* 指示膠囊：兩個項目等寬，位移 100% 剛好是一個項目的寬度 */
  .glass::before {
    content: ""; position: absolute; z-index: -1; inset-block: 4px; inset-inline-start: 4px; inline-size: calc(50% - 4px); border-radius: 999px; translate: 0 0;
    background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,.08)); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 1px 4px rgba(0,0,0,.25);
    transition: translate .5s cubic-bezier(.34, 1.2, .64, 1); transition-timing-function: var(--spring);
  }
  .glass:has(#navList[aria-current="page"])::before { translate: 100% 0; }
  /* 不支援 :has() 的舊瀏覽器：沒有滑動，目前項目自己有底色 */
  @supports not selector(:has(*)) {
    .glass::before { display: none; }
    .glass a[aria-current="page"] { background: rgba(255,255,255,.2); }
  }
  @media (prefers-reduced-motion: reduce) { .glass::before { transition: none; } }
  @media (prefers-reduced-motion: no-preference) {
    .glass a { transition: scale .2s; }
    .glass a:active { scale: .94; }
  }
  @media (forced-colors: active) {
    .glass, #sheet { border: 1px solid CanvasText; background: Canvas; }
    .glass::before { border: 2px solid Highlight; background: none; box-shadow: none; }
  }
  /* 導覽列浮在地圖上，其他元件要讓開 */
  .leaflet-bottom { bottom: var(--nav-space); }

  .pin-wrap { background: none; border: 0; }
  .pin { position: absolute; left: 3px; top: 1px; width: 22px; height: 22px; background: var(--accent); border: 2px solid #111;
    border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .pin.kind-landmark { background: var(--landmark); }
  .pin-wrap.sel .pin { background: #fff; transform: rotate(-45deg) scale(1.25); border-color: var(--accent); }

  .shop-label { max-width: 190px; overflow: hidden; text-overflow: ellipsis; padding: 2px 8px; border: 1px solid var(--line); border-radius: 8px;
    background: rgba(23,25,30,.94); color: #fff; font-size: 12px; font-weight: 600; box-shadow: none; pointer-events: auto; cursor: pointer; }
  .shop-label::before { display: none; }
  .shop-label .tag { color: var(--accent); margin-right: 2px; }
  .labels-off .shop-label { display: none; }
  .legend { padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: rgba(23,25,30,.92); color: var(--text); font-size: 12px; line-height: 1.8; }
  .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 50%; vertical-align: -1px; }
  .legend .d-shop { background: var(--accent); }
  .legend .d-landmark { background: var(--landmark); }
  #sheet { --glass-a: .78; position: absolute; inset: auto 8px var(--nav-space); z-index: 1000; width: auto; max-width: none; height: auto; max-height: 62%; margin: 0; overflow-y: auto; overscroll-behavior: contain; padding: 16px;
    color: var(--text); border-radius: 24px; }
  #sheet .row, #sheet .until { color: rgba(255,255,255,.8); }
  #sheet .row a { text-decoration-color: rgba(255,255,255,.5); }
  #sheet .close { border-color: rgba(255,255,255,.3); color: rgba(255,255,255,.85); background: rgba(255,255,255,.08); }
  #sheet .offers { background: rgba(255,180,0,.16); }
  .head form { margin: 0; }
  .head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .name { margin: 0; font-size: 19px; font-weight: 700; line-height: 1.3; }
  .close { flex: none; width: 36px; height: 36px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--muted); font-size: 18px; line-height: 1; }
  .chip { display: inline-block; margin-top: 6px; padding: 2px 10px; border-radius: 999px; background: rgba(255,180,0,.15); color: var(--accent); font-size: 12px; font-weight: 700; }
  .chip + .chip { margin-left: 6px; }
  .chip.landmark { background: rgba(78,161,255,.16); color: var(--landmark); }
  .section { margin: 18px 4px 8px; font-size: 13px; font-weight: 700; letter-spacing: .05em; color: var(--muted); }
  .row { margin: 10px 0 0; font-size: 14px; line-height: 1.6; color: var(--muted); white-space: pre-line; }
  .row a { color: var(--text); }
  .row.desc { margin-top: 12px; font-size: 15px; color: var(--text); }
  #sheet .row.desc { color: #fff; }
  .offers { margin: 12px 0 0; padding: 10px 12px 10px 28px; border-radius: 10px; background: rgba(255,180,0,.10); font-size: 15px; line-height: 1.7; }
  .until { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
  .head > div:first-child { min-width: 0; }
  .tools { display: flex; flex: none; gap: 6px; }
  .tools form { margin: 0; }
  .ico { display: grid; place-items: center; width: 36px; height: 36px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--text); text-decoration: none; }
  .ico svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .ico.primary { background: var(--accent); border-color: var(--accent); color: #111; }
  #sheet .ico:not(.primary) { border-color: rgba(255,255,255,.3); background: rgba(255,255,255,.08); }
  .ico:focus-visible, .more summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .more { margin-top: 10px; }
  .more summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; list-style: none; cursor: pointer; font-size: 13px; color: var(--muted); }
  .more summary::-webkit-details-marker { display: none; }
  .more summary::after { content: ""; flex: none; inline-size: 8px; block-size: 8px; margin-inline-end: 4px; border-inline-end: 2px solid currentColor; border-block-end: 2px solid currentColor; rotate: 45deg; translate: 0 -2px; transition: rotate .2s; }
  .more[open] summary::after { rotate: -135deg; translate: 0 2px; }
  #sheet .more summary { color: rgba(255,255,255,.7); }
  .more .row:first-of-type { margin-top: 2px; }
  @media (prefers-reduced-motion: reduce) { .more summary::after { transition: none; } }

  .card { padding: 14px; margin-bottom: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  .card .name { font-size: 17px; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); line-height: 1.8; }
</style>
</head>
<body>
<main id="stage">
  <h1 class="visually-hidden">成大機動車研究社 特約店家與社團地點地圖</h1>
  <div id="map" hidden></div>
  <div id="list" hidden></div>
  <dialog id="sheet" aria-labelledby="sheetTitle" closedby="closerequest"></dialog>
  <div id="note" role="status" hidden></div>
  <div id="state"><span>載入中…</span></div>
</main>
<nav aria-label="切換檢視">
  <div class="glass">
    <a id="navMap" href="#map">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span class="visually-hidden">地圖</span>
    </a>
    <a id="navList" href="#list">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg><span class="visually-hidden">列表</span>
    </a>
  </div>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin="anonymous"></script>
<script>
  // ===== 設定（不是機密，可以放在公開的 repo） =====
  const SHOPS_API = 'https://script.google.com/macros/s/AKfycbxp8GAxZ0OWR-gTlE1UrK4EGLLByWPSqFrJ-lj-O8kcljgEfpH6oh2YpJ-X00ISN2EZ3Q/exec';
  const TILE_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
  const TILE_ATTRIBUTION = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
  const CACHE_KEY = 'shops:cache:v1';
  const DEFAULT_CENTER = [22.9997, 120.227];
  const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const LABELS_ALWAYS_MAX = 15;
  const LABELS_MIN_ZOOM = 14;

  const $ = (id) => document.getElementById(id);

  function el(tag, props, ...kids) {
    const node = document.createElement(tag);
    Object.entries(props || {}).forEach(([k, v]) => {
      if (v == null) return;
      if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else if (k.includes('-')) node.setAttribute(k, v);
      else node[k] = v;
    });
    kids.forEach((k) => node.append(k));
    return node;
  }

  // ===== 純函式 =====
  // 優先用幹部貼的 Google 地圖店家連結（落點最準）；沒有才退回座標。座標只用來在 OpenStreetMap 上擺標記
  function navigationUrl(shop) {
    const link = httpUrl(shop.mapLink);
    if (link) return link;
    const u = new URL('https://www.google.com/maps/dir/');
    u.searchParams.set('api', '1');
    u.searchParams.set('destination', shop.lat + ',' + shop.lng);
    return u.toString();
  }

  function kindOf(shop) { return shop.kind === 'landmark' ? 'landmark' : 'shop'; }

  function httpUrl(raw) {
    try { const u = new URL(raw); return u.protocol === 'http:' || u.protocol === 'https:' ? u.href : ''; } catch (_) { return ''; }
  }

  function parseHash(hash) {
    const [view, id] = String(hash || '').replace(/^#/, '').split('/');
    return { view: view === 'list' ? 'list' : 'map', shopId: id || null };
  }

  function formatHash(view, shopId) {
    return '#' + view + (view === 'map' && shopId ? '/' + shopId : '');
  }

  // ===== 狀態（唯一的擁有者；地圖與列表都只讀它） =====
  const store = { shops: [], byId: new Map(), selectedId: null, view: 'map' };
  let map = null;
  let legendEl = null;
  let markers = new Map();

  function setShops(shops) {
    store.shops = shops;
    store.byId = new Map(shops.map((s) => [s.id, s]));
    if (store.selectedId && !store.byId.has(store.selectedId)) store.selectedId = null;
    renderMarkers();
    renderList();
    renderSheet();
  }

  function select(id) {
    store.selectedId = id && store.byId.has(id) ? id : null;
    markers.forEach((m, sid) => { const e = m.getElement(); if (e) e.classList.toggle('sel', sid === store.selectedId); });
    renderSheet();
    const shop = store.byId.get(store.selectedId);
    if (shop && map && store.view === 'map') {
      const zoom = Math.max(map.getZoom(), 15);
      const below = L.point(0, Math.round($('sheet').offsetHeight / 2));
      map.setView(map.unproject(map.project([shop.lat, shop.lng], zoom).add(below), zoom), zoom, { animate: !reduceMotion() });
    }
    syncHash();
  }

  function show(view) {
    store.view = view;
    $('map').hidden = view !== 'map';
    $('list').hidden = view !== 'list';
    setCurrent($('navMap'), view === 'map');
    setCurrent($('navList'), view === 'list');
    if (view === 'map') { ensureMap(); map.invalidateSize(); renderMarkers(); }
    renderSheet();
    syncHash();
  }

  function setCurrent(btn, on) {
    if (on) btn.setAttribute('aria-current', 'page'); else btn.removeAttribute('aria-current');
  }

  function syncHash() {
    const next = formatHash(store.view, store.selectedId);
    if (location.hash !== next) history.replaceState(null, '', next);
  }

  // ===== 資料 =====
  async function fetchShops() {
    const res = await fetch(SHOPS_API, { signal: AbortSignal.timeout?.(15000) });
    const data = await res.json();
    if (!data.ok || !Array.isArray(data.shops)) throw new Error(data.error || 'BAD_RESPONSE');
    return data.shops;
  }

  function readCache() {
    try { const v = JSON.parse(localStorage.getItem(CACHE_KEY)); return Array.isArray(v) ? v : null; } catch (_) { return null; }
  }
  function writeCache(shops) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(shops)); } catch (_) {} }

  function showNote(text) { $('note').textContent = text; $('note').hidden = !text; }
  function showState(node) { $('state').replaceChildren(...(node ? [node] : [])); $('state').hidden = !node; }

  async function load() {
    const cached = readCache();
    if (cached) { setShops(cached); showState(null); applyHash(); }
    try {
      const shops = await fetchShops();
      writeCache(shops);
      setShops(shops);
      showNote('');
      showState(null);
      if (!cached) applyHash();
      if (!store.shops.length) showState(el('span', {}, '目前還沒有地點，請稍後再來看看。'));
      else fitAll();
    } catch (_) {
      if (cached) showNote('目前顯示的是上次的資料，網路恢復後會自動更新。');
      else showState(el('span', {}, '載入失敗，請檢查網路後再試一次。', el('br'), el('button', { className: 'btn', type: 'button', onclick: load }, '重新載入')));
    }
  }

  // ===== 地圖 =====
  function ensureMap() {
    if (map) return;
    const animate = !reduceMotion();
    map = L.map('map', { zoomControl: true, attributionControl: true, zoomAnimation: animate, fadeAnimation: animate, markerZoomAnimation: animate }).setView(DEFAULT_CENTER, 14);
    L.tileLayer(TILE_URL, { maxZoom: 19, attribution: TILE_ATTRIBUTION }).addTo(map);
    map.on('click', () => select(null));
    map.on('zoomend', updateLabels);
    const legend = L.control({ position: 'topright' });
    legend.onAdd = () => {
      legendEl = el('div', { className: 'legend', hidden: true },
        el('div', {}, el('i', { className: 'd-shop' }), '特約店家'),
        el('div', {}, el('i', { className: 'd-landmark' }), '社團地標'));
      L.DomEvent.disableClickPropagation(legendEl);
      return legendEl;
    };
    legend.addTo(map);
  }

  // 地點不多時一律顯示名稱；很多時要放大到一定程度才顯示，避免擠成一團
  function updateLabels() {
    if (!map) return;
    const show = store.shops.length <= LABELS_ALWAYS_MAX || map.getZoom() >= LABELS_MIN_ZOOM;
    $('map').classList.toggle('labels-off', !show);
  }

  function renderMarkers() {
    if (!map) return;
    markers.forEach((m) => m.remove());
    markers = new Map();
    store.shops.forEach((s) => {
      const kind = kindOf(s);
      const icon = L.divIcon({ className: 'pin-wrap' + (s.id === store.selectedId ? ' sel' : ''), html: '<span class="pin kind-' + kind + '"></span>', iconSize: [28, 28], iconAnchor: [14, 28] });
      const m = L.marker([s.lat, s.lng], { icon, title: s.name }).addTo(map);
      m.on('click', (e) => { L.DomEvent.stopPropagation(e); select(s.id); });
      m.bindTooltip(el('span', {}, kind === 'shop' ? el('span', { className: 'tag' }, '「特約」') : '', s.name),
        { permanent: true, interactive: true, direction: 'right', offset: [12, -14], className: 'shop-label' });
      m.on('tooltipopen', (e) => {
        const t = e.tooltip.getElement();
        if (t && !t.dataset.bound) { t.dataset.bound = '1'; t.addEventListener('click', (ev) => { L.DomEvent.stopPropagation(ev); select(s.id); }); }
      });
      markers.set(s.id, m);
    });
    if (legendEl) legendEl.hidden = !store.shops.some((s) => kindOf(s) === 'landmark');
    updateLabels();
  }

  function fitAll() {
    if (!map || !store.shops.length || store.selectedId) return;
    const pts = store.shops.map((s) => [s.lat, s.lng]);
    if (pts.length === 1) map.setView(pts[0], 16);
    else map.fitBounds(pts, { padding: [48, 48], maxZoom: 16 });
  }

  // ===== 店家資訊與列表 =====
  function offerBlock(shop) {
    if (!shop.offers.length) return null;
    const ul = el('ul', { className: 'offers' }, ...shop.offers.map((t) => el('li', {}, t)));
    return [ul, shop.offersUntil ? el('p', { className: 'until' }, '優惠至 ' + shop.offersUntil.replace(/-/g, '/')) : null];
  }

  // 說明與地址一直顯示；營業時間、電話、連結收進可展開的區塊，卡片才不會太長
  function infoBlocks(shop) {
    const blocks = [];
    if (shop.description) blocks.push(el('p', { className: 'row desc' }, shop.description));
    if (shop.address) blocks.push(el('p', { className: 'row' }, shop.address));
    const more = [];
    const labels = [];
    if (shop.hours) { labels.push('營業時間'); more.push(el('p', { className: 'row' }, shop.hours)); }
    if (shop.phone) { labels.push('電話'); more.push(el('p', { className: 'row' }, '電話 ', el('a', { href: 'tel:' + shop.phone.replace(/[^\d+]/g, '') }, shop.phone))); }
    const link = httpUrl(shop.link);
    if (link) { labels.push('連結'); more.push(el('p', { className: 'row' }, '連結 ', el('a', { href: link, target: '_blank', rel: 'noopener noreferrer' }, new URL(link).hostname))); }
    if (more.length) blocks.push(el('details', { className: 'more' }, el('summary', {}, labels.join('・')), ...more));
    return blocks;
  }

  function chips(shop) {
    const wrap = el('div', {}, el('span', { className: 'chip' + (kindOf(shop) === 'landmark' ? ' landmark' : '') }, kindOf(shop) === 'landmark' ? '地標' : '特約'));
    if (shop.category) wrap.append(el('span', { className: 'chip' + (kindOf(shop) === 'landmark' ? ' landmark' : '') }, shop.category));
    return wrap;
  }

  const ICON_NAV = '<path d="M3 11l18-8-8 18-2-8z"/>';
  const ICON_PIN = '<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>';
  function icon(paths) {
    const span = el('span', { className: 'svg' });
    span.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + paths + '</svg>'; // 固定的常數字串，不含使用者資料
    return span.firstChild;
  }

  function navButton(shop) {
    return el('a', { className: 'ico primary', href: navigationUrl(shop), target: '_blank', rel: 'noopener noreferrer', 'aria-label': '用 Google 地圖導航', title: '用 Google 地圖導航' }, icon(ICON_NAV));
  }

  // 非強制式對話框：地圖仍可操作。關閉鈕在 <form method="dialog"> 裡，瀏覽器原生關閉
  function renderSheet() {
    const shop = store.byId.get(store.selectedId);
    const dlg = $('sheet');
    if (!shop || store.view !== 'map') {
      if (dlg.open) dlg.close();
      if (!shop) dlg.replaceChildren();
      return;
    }
    const offers = offerBlock(shop);
    dlg.replaceChildren(
      el('div', { className: 'head' },
        el('div', {}, el('h2', { className: 'name', id: 'sheetTitle' }, shop.name), chips(shop)),
        el('div', { className: 'tools' }, navButton(shop),
          el('form', { method: 'dialog' }, el('button', { className: 'close', 'aria-label': '關閉', onclick: () => select(null) }, '✕')))),
      ...(offers || []).filter(Boolean),
      ...infoBlocks(shop)
    );
    if (!dlg.open) dlg.show();
  }

  function renderList() {
    const list = $('list');
    if (!store.shops.length) { list.replaceChildren(el('div', { className: 'empty' }, '目前還沒有地點。')); return; }
    const card = (s) => {
      const offers = offerBlock(s);
      return el('article', { className: 'card' },
        el('div', { className: 'head' },
          el('div', {}, el('h2', { className: 'name' }, s.name), chips(s)),
          el('div', { className: 'tools' },
            el('button', { className: 'ico', type: 'button', 'aria-label': '在地圖上查看', title: '在地圖上查看', onclick: () => { show('map'); select(s.id); } }, icon(ICON_PIN)),
            navButton(s))),
        ...(offers || []).filter(Boolean),
        ...infoBlocks(s)
      );
    };
    const shops = store.shops.filter((s) => kindOf(s) === 'shop');
    const landmarks = store.shops.filter((s) => kindOf(s) === 'landmark');
    const both = shops.length && landmarks.length;
    list.replaceChildren(
      ...(both ? [el('div', { className: 'section' }, '特約店家')] : []), ...shops.map(card),
      ...(landmarks.length ? [el('div', { className: 'section' }, '常用地標')] : []), ...landmarks.map(card));
  }

  // ===== 啟動 =====
  function applyHash() {
    const { view, shopId } = parseHash(location.hash);
    show(view);
    if (shopId) select(shopId);
  }

  // 對話框被使用者關掉（例如 Esc）但狀態還認為該開著，就同步清除選取；程式自己關的情況，狀態早已不該開著，會被略過
  $('sheet').addEventListener('close', () => {
    if (store.selectedId && store.view === 'map') select(null);
  });
  window.addEventListener('hashchange', () => { const h = parseHash(location.hash); if (h.view !== store.view || h.shopId !== store.selectedId) applyHash(); });
  load();
</script>
</body>
</html>
