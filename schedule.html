<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0e0f12">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<script>
  // 在 <head> 就開始抓活動資料，主程式接手這個請求；「重新載入」才重新請求
  const EVENTS_API = 'https://script.google.com/macros/s/AKfycbxz1tg6InFh-X7wYc393a0otEp8A6ynY0a7yxZQob7Tk_-3f7DRiBZJRlwFY3z8BPhgQg/exec';
  let earlyEvents = fetch(EVENTS_API, { signal: AbortSignal.timeout?.(15000) });
  earlyEvents.catch(() => {});
</script>
<title>成大機動車研究社 活動時間表</title>
<style>
  :root {
    --bg: #0e0f12; --panel: #17191e; --text: #f2f2f2; --muted: #9aa0a8; --line: #2a2d34; --accent: #ffb400;
    color-scheme: dark; accent-color: var(--accent);
    --nav-h: 54px; --nav-gap: max(12px, env(safe-area-inset-bottom)); --nav-space: calc(var(--nav-h) + var(--nav-gap) + 16px);
    --top-h: calc(max(20px, env(safe-area-inset-top)) + 34px + 10px + 12px); /* 標題列的高度，內容要留出這一塊 */
    --spring: linear(0, 0.3 8%, 0.8 18%, 1.03 30%, 1.02 40%, 0.995 55%, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* 捲動發生在中間這個容器（#scroller）裡，不是整個文件：上方標題列與底部篩選列都在容器外面、固定不動，
     所以 iOS 捲到頂或底時的橡皮筋彈跳只會動到列表，標題列不會跟著動。
     文件本身不捲動（html、body 高度固定、overflow hidden），也就不會有整頁的彈跳 */
  html, body { block-size: 100%; overflow: hidden; }
  #scroller { position: fixed; inset: 0; overflow-y: auto; overflow-x: clip; -webkit-overflow-scrolling: touch;
    scroll-padding-block: var(--top-h) calc(var(--nav-space) + 8px); }
  /* Android（Chrome）捲到頂或底會出現拉伸／發光效果，連標題列後面模糊的內容也一起被拉伸，所以關掉；
     iOS 的橡皮筋彈跳保留（-webkit-touch-callout 只有 iOS 的 WebKit 認得，下面的規則就只套用在非 iOS） */
  @supports not (-webkit-touch-callout: none) { #scroller { overscroll-behavior: none; } }
  #scroller:focus-visible { outline-offset: -3px; } /* 可以用鍵盤的方向鍵與空白鍵捲動 */
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; line-height: 1.5; }
  [hidden] { display: none !important; }
  :where(a, button, summary):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-inline-size: 640px; margin-inline: auto; padding-inline: 12px; }

  /* 玻璃材質（和地圖頁同一套）：半透明底加模糊、內側高光、外側陰影。篩選列有文字、下面有卡片捲過，所以用彈窗那一級（較不透明、模糊 3px） */
  .glass {
    --glass-a: .72;
    background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,0) 55%), rgba(24, 26, 31, var(--glass-a));
    -webkit-backdrop-filter: blur(3px) saturate(180%); backdrop-filter: blur(3px) saturate(180%);
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(255,255,255,.06), 0 8px 24px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.25);
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: var(--panel); } }
  @media (prefers-reduced-transparency: reduce) { .glass { background: var(--panel); -webkit-backdrop-filter: none; backdrop-filter: none; } }

  /* 上方標題列：像 iOS 狀態列的毛玻璃漸層。整條滿版、沒有邊框與圓角；模糊和底色都由上往下漸漸淡出，
     卡片從下面捲過去時會先變模糊、再慢慢清楚。兩層模糊（輕的較長、重的較短）疊出漸進的感覺；文字不在被遮罩的圖層裡，不會跟著淡掉 */
  .top { position: fixed; inset-inline: 0; inset-block-start: 0; z-index: 10; isolation: isolate; padding-block: max(20px, env(safe-area-inset-top)) 10px; }
  .top::before, .top::after { content: ""; position: absolute; inset-inline: 0; inset-block-start: 0; z-index: -1; pointer-events: none; }
  .top::before {
    block-size: calc(100% + 30px);
    background: linear-gradient(to bottom, rgba(14, 15, 18, .9), rgba(14, 15, 18, .55) 55%, rgba(14, 15, 18, 0));
    -webkit-backdrop-filter: blur(3px) saturate(160%); backdrop-filter: blur(3px) saturate(160%);
    -webkit-mask-image: linear-gradient(to bottom, #000 35%, transparent); mask-image: linear-gradient(to bottom, #000 35%, transparent);
  }
  .top::after {
    block-size: 100%;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    -webkit-mask-image: linear-gradient(to bottom, #000 25%, transparent); mask-image: linear-gradient(to bottom, #000 25%, transparent);
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .top::before { background: linear-gradient(to bottom, var(--bg) 40%, transparent); } .top::after { display: none; } }
  @media (prefers-reduced-transparency: reduce) { .top::before { -webkit-backdrop-filter: none; backdrop-filter: none; background: linear-gradient(to bottom, var(--bg) 40%, transparent); } .top::after { display: none; } }
  .top .wrap { position: relative; }
  /* 右上角的「測試中」標：功能正式上線後，把這個 <span class="beta"> 刪掉就好 */
  .beta { position: absolute; inset-inline-end: 12px; inset-block-start: 50%; translate: 0 -50%; padding: 2px 10px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--accent) 65%, transparent);
    background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); font-size: 12px; font-weight: 700; white-space: nowrap; }
  h1 { margin: 0; font-size: 28px; font-weight: 800; line-height: 1.2; letter-spacing: .02em; text-align: center; }

  /* 浮動玻璃篩選列：和地圖頁的導覽列一樣，彈性滑動的指示膠囊 */
  nav { position: fixed; z-index: 1200; inset-inline: 0; inset-block-end: var(--nav-gap); display: flex; justify-content: center; pointer-events: none; }
  .glass { pointer-events: auto; position: relative; isolation: isolate; display: grid; grid-template-columns: repeat(3, 1fr); inline-size: min(300px, calc(100% - 32px)); padding: 4px; border-radius: 999px; }
  .glass button { position: relative; min-block-size: calc(var(--nav-h) - 8px); padding: 0; border: 0; border-radius: 999px; background: none; scale: 1; color: rgba(255,255,255,.7); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .glass button[aria-pressed="true"] { color: #fff; }
  .glass::before {
    content: ""; position: absolute; z-index: -1; inset-block: 4px; inset-inline-start: 4px; inline-size: calc((100% - 8px) / 3); border-radius: 999px; translate: 0 0;
    background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,.08)); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 1px 4px rgba(0,0,0,.25);
    transition: translate .5s cubic-bezier(.34, 1.2, .64, 1); transition-timing-function: var(--spring);
  }
  .glass[data-i="1"]::before { translate: 100% 0; }
  .glass[data-i="2"]::before { translate: 200% 0; }
  @media (prefers-reduced-motion: reduce) { .glass::before { transition: none; } }
  @media (prefers-reduced-motion: no-preference) {
    .glass button { transition: scale .2s; }
    .glass button:active { scale: .94; }
  }
  @media (hover: hover) { .glass button:hover { color: #fff; } .ico:hover { filter: brightness(1.15); } }
  @media (forced-colors: active) { .glass { border: 1px solid CanvasText; background: Canvas; } .glass::before { border: 2px solid Highlight; background: none; box-shadow: none; } }

  main { padding-block: var(--top-h) calc(var(--nav-space) + 8px); }
  #note, #state { margin-block: 16px; padding: 12px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 14px; text-align: center; }
  #state button { margin-block-start: 10px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: #111; font: inherit; font-weight: 700; cursor: pointer; }

  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .month { margin: 18px 4px 2px; font-size: 13px; font-weight: 700; letter-spacing: .05em; color: var(--muted); }

  .kind-class { --k: #4ea1ff; } .kind-ride { --k: #34c28b; } .kind-other { --k: #9aa4b2; }
  .ev { position: relative; display: grid; grid-template-columns: 56px 1fr; gap: 14px; padding: 14px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line);
    border-inline-start: 4px solid var(--k); transition: opacity .3s, filter .3s; }
  .date { display: grid; justify-items: center; align-content: start; line-height: 1.15; }
  .date .m { font-size: 12px; color: var(--muted); }
  .date .d { font-size: 28px; font-weight: 800; }
  .date .w { font-size: 12px; color: var(--muted); }
  .body { min-inline-size: 0; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .chip { padding: 1px 9px; border-radius: 999px; background: color-mix(in srgb, var(--k) 18%, transparent); color: var(--k); font-size: 12px; font-weight: 700; }
  h2 { margin: 4px 0 0; font-size: 18px; font-weight: 700; line-height: 1.35; text-wrap: balance; }
  .place { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-block-start: 8px; font-size: 14px; color: var(--muted); text-wrap: pretty; }
  /* 導航按鈕：和地圖頁一樣，黃色實心圓形箭頭 */
  .ico { flex: none; display: grid; place-items: center; inline-size: 36px; block-size: 36px; padding: 0; border-radius: 50%; border: 1px solid var(--accent); background: var(--accent); color: #111; text-decoration: none; }
  .ico svg { inline-size: 19px; block-size: 19px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .ico:active { opacity: .6; }
  .row { margin: 8px 0 0; font-size: 14px; line-height: 1.6; color: var(--muted); white-space: pre-line; text-wrap: pretty; }
  .badge { position: absolute; inset-block-start: -10px; inset-inline-end: 12px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; color: #111; background: var(--k); }

  /* 說明收進摺疊區：和地圖頁同一套（箭頭、展開收合動畫） */
  .more { margin-block-start: 6px; }
  .more summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; list-style: none; cursor: pointer; font-size: 13px; color: var(--muted); }
  .more summary::-webkit-details-marker { display: none; }
  .more summary::after { content: ""; flex: none; inline-size: 8px; block-size: 8px; margin-inline-end: 4px; border-inline-end: 2px solid currentColor; border-block-end: 2px solid currentColor; rotate: 45deg; translate: 0 -2px; transition: rotate .2s; }
  .more[open] summary::after { rotate: -135deg; translate: 0 2px; }
  .more summary:active { opacity: .6; }
  @media (hover: hover) { .more summary:hover { color: var(--text); } }
  @supports selector(::details-content) {
    :root { interpolate-size: allow-keywords; }
    .more::details-content { contain: layout; block-size: 0; overflow: clip; transition: block-size .32s cubic-bezier(.22, 1, .36, 1), content-visibility .32s allow-discrete; }
    .more[open]::details-content { block-size: auto; }
    @media (prefers-reduced-motion: reduce) { .more::details-content { transition: none; } }
  }
  .more .row:first-of-type { margin-block-start: 2px; }
  @media (prefers-reduced-motion: reduce) { .more summary::after { transition: none; } }

  /* 已經結束：整張反灰 */
  .ev.past { opacity: .45; filter: grayscale(1); }
  /* 下一場：外框、淡淡的光暈、日期數字、標記都用類型顏色（社課藍、團騎綠、其他灰）；同一天還沒結束的活動都會有 */
  .ev.next { border-color: var(--k); background: color-mix(in srgb, var(--k) 9%, var(--panel));
    box-shadow: 0 0 0 1px var(--k), 0 8px 28px color-mix(in srgb, var(--k) 24%, transparent); }
  .ev.next .date .d { color: var(--k); }
  .ev.now .badge::before { content: ""; display: inline-block; inline-size: 7px; block-size: 7px; margin-inline-end: 6px; border-radius: 50%; background: #111; vertical-align: 1px; }
  @media (prefers-reduced-motion: no-preference) { .ev.now .badge::before { animation: pulse 1.4s ease-in-out infinite; } }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .ev { transition: none; } }
  @media (forced-colors: active) { .ev.next { border: 3px solid Highlight; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap"><h1>活動時間表</h1><span class="beta">測試中</span></div>
</header>
<div id="scroller" tabindex="0" aria-label="活動列表">
<main class="wrap">
  <div id="note" role="status" hidden></div>
  <div id="state">載入中…</div>
  <ol id="list" hidden></ol>
</main>
</div>
<nav aria-label="活動類型">
  <div class="glass" id="filters" role="group" aria-label="活動類型" data-i="0">
    <button type="button" aria-pressed="true" data-f="all">全部</button>
    <button type="button" aria-pressed="false" data-f="class">社課</button>
    <button type="button" aria-pressed="false" data-f="ride">團騎</button>
  </div>
</nav>

<script>
  const CACHE_KEY = 'events:cache:v1';
  const TZ = 'Asia/Taipei', TZ_OFFSET = '+08:00'; // 活動時間一律是台灣時間，不管使用者的裝置在哪個時區
  const DEFAULT_LENGTH_MS = 3 * 3600e3;          // 沒填結束時間：開始後 3 小時內算進行中
  const TYPE_LABEL = { class: '社課', ride: '團騎', other: '其他' };
  const FILTERS = ['all', 'class', 'ride'];
  const PAN_PX = 12; // 要小於或等於 .wrap 的左右 padding
  const $ = (id) => document.getElementById(id);
  const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ==== pure start ====
  const startMs = (e) => Date.parse(e.date + 'T' + e.start + ':00' + TZ_OFFSET);
  const endMs = (e) => (e.end ? Date.parse(e.date + 'T' + e.end + ':00' + TZ_OFFSET) : startMs(e) + DEFAULT_LENGTH_MS);

  /** 'past'＝已結束；'now'＝進行中；'upcoming'＝還沒開始 */
  function stateOf(e, now) {
    if (now >= endMs(e)) return 'past';
    return now >= startMs(e) ? 'now' : 'upcoming';
  }

  /** 下一場：依時間排序的活動裡，第一個還沒結束的（進行中的也算） */
  function pickNext(events, now) {
    return events.find((e) => stateOf(e, now) !== 'past') || null;
  }

  /** 要標成「下一場」的活動：下一場本身，加上同一天、還沒結束的其他活動（例如同一天的社課與團騎都要有外框） */
  function pickNextGroup(events, now) {
    const next = pickNext(events, now);
    return next ? events.filter((e) => e.date === next.date && stateOf(e, now) !== 'past') : [];
  }

  const taipeiDate = (ms) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(ms); // yyyy-mm-dd
  const daysBetween = (fromDate, toDate) => Math.round((Date.parse(toDate + 'T00:00:00' + TZ_OFFSET) - Date.parse(fromDate + 'T00:00:00' + TZ_OFFSET)) / 864e5);

  /** 標記上的文字：進行中／今天／明天／還有 N 天 */
  function badgeText(e, now) {
    if (stateOf(e, now) === 'now') return '進行中';
    const d = daysBetween(taipeiDate(now), e.date);
    return '下一場 · ' + (d <= 0 ? '今天' : d === 1 ? '明天' : '還有 ' + d + ' 天');
  }

  const sameMonth = (a, b) => a.slice(0, 7) === b.slice(0, 7);
  // ==== pure end ====

  const store = { events: [], filter: 'all' };

  // ===== 畫面 =====
  const ICON_NAV = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"/></svg>';
  function el(tag, props, ...kids) {
    const node = document.createElement(tag);
    Object.entries(props || {}).forEach(([k, v]) => {
      if (v == null) return;
      if (k.includes('-')) node.setAttribute(k, v); else node[k] = v;
    });
    kids.forEach((k) => k != null && node.append(k));
    return node;
  }
  const httpsUrl = (raw) => { try { const u = new URL(raw); return u.protocol === 'https:' ? u.href : ''; } catch (_) { return ''; } };

  const fmtWeekday = new Intl.DateTimeFormat('zh-TW', { timeZone: TZ, weekday: 'short' });
  function card(e) {
    const t = e.end ? e.start + ' – ' + e.end : e.start;
    const link = httpsUrl(e.mapLink);
    const nav = link && el('a', { className: 'ico', href: link, target: '_blank', rel: 'noopener noreferrer', 'aria-label': '用 Google 地圖導航到' + (e.place || e.title), title: '用 Google 地圖導航' });
    if (nav) nav.innerHTML = ICON_NAV; // 固定的常數字串，不含使用者資料
    return el('article', { className: 'ev kind-' + e.type, 'data-id': e.id },
      el('div', { className: 'date' },
        el('span', { className: 'm' }, Number(e.date.slice(5, 7)) + ' 月'),
        el('span', { className: 'd' }, String(Number(e.date.slice(8, 10)))),
        el('span', { className: 'w' }, fmtWeekday.format(Date.parse(e.date + 'T12:00:00' + TZ_OFFSET)))),
      el('div', { className: 'body' },
        el('div', { className: 'meta' }, el('time', { dateTime: e.date + 'T' + e.start }, t), el('span', { className: 'chip' }, TYPE_LABEL[e.type] || '其他')),
        el('h2', {}, e.title),
        (e.place || nav) ? el('div', { className: 'place' }, el('span', {}, e.place), nav) : null,
        e.description ? el('details', { className: 'more' }, el('summary', {}, '說明'), el('div', { className: 'more-body' }, el('p', { className: 'row' }, e.description))) : null));
  }

  function visibleEvents() { return store.events.filter((e) => store.filter === 'all' || e.type === store.filter); }

  function render() {
    const events = visibleEvents();
    const list = $('list');
    $('state').hidden = events.length > 0;
    if (!events.length) $('state').replaceChildren(document.createTextNode(store.events.length ? '這個類型目前沒有安排的活動。' : '目前沒有安排的活動，請稍後再來看看。'));
    list.hidden = !events.length;
    const nodes = [];
    events.forEach((e, i) => {
      if (i === 0 || !sameMonth(events[i - 1].date, e.date)) nodes.push(el('li', { className: 'month', 'aria-hidden': 'true' }, e.date.slice(0, 4) + ' 年 ' + Number(e.date.slice(5, 7)) + ' 月'));
      nodes.push(el('li', {}, card(e)));
    });
    list.replaceChildren(...nodes);
    applyStates();
  }

  // 依「現在」標示已結束、進行中、下一場；每分鐘重算一次（不重畫，捲動位置不會跳）
  function applyStates() {
    const now = Date.now();
    const events = visibleEvents();
    const group = new Set(pickNextGroup(events, now).map((e) => e.id));
    document.querySelectorAll('#list .ev').forEach((node) => {
      const e = events.find((x) => x.id === node.dataset.id);
      if (!e) return;
      const st = stateOf(e, now);
      const isNext = group.has(e.id);
      node.classList.toggle('past', st === 'past');
      node.classList.toggle('now', isNext && st === 'now');
      node.classList.toggle('next', !!isNext);
      if (isNext) node.setAttribute('aria-current', 'true'); else node.removeAttribute('aria-current');
      let badge = node.querySelector('.badge');
      if (isNext) { if (!badge) { badge = el('span', { className: 'badge' }); node.prepend(badge); } badge.textContent = badgeText(e, now); }
      else badge?.remove();
    });
  }

  function scrollToNext(smooth) {
    const node = document.querySelector('#list .ev.next');
    node?.scrollIntoView({ block: 'center', behavior: smooth && !reduceMotion() ? 'smooth' : 'auto' });
  }

  // ===== 資料 =====
  async function fetchEvents() {
    const req = earlyEvents ?? fetch(EVENTS_API, { signal: AbortSignal.timeout?.(15000) });
    earlyEvents = null;
    const res = await req;
    const data = await res.json();
    if (!data.ok || !Array.isArray(data.events)) throw new Error(data.error || 'BAD_RESPONSE');
    return data.events;
  }
  const readCache = () => { try { const v = JSON.parse(localStorage.getItem(CACHE_KEY)); return Array.isArray(v) ? v : null; } catch (_) { return null; } };
  const writeCache = (v) => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(v)); } catch (_) {} };
  const showNote = (text) => { $('note').textContent = text; $('note').hidden = !text; };

  async function load() {
    const cached = readCache();
    let first = true;
    if (cached) { store.events = cached; render(); scrollToNext(false); first = false; }
    try {
      const events = await fetchEvents();
      writeCache(events);
      const changed = JSON.stringify(events) !== JSON.stringify(store.events);
      store.events = events; showNote('');
      if (changed || first) { render(); if (first) scrollToNext(false); }
    } catch (_) {
      if (cached) showNote('目前顯示的是上次的資料，網路恢復後會自動更新。');
      else {
        const retry = el('button', { type: 'button' }, '重新載入'); retry.addEventListener('click', () => { $('state').replaceChildren(document.createTextNode('載入中…')); load(); });
        $('state').hidden = false; $('list').hidden = true;
        $('state').replaceChildren(document.createTextNode('載入失敗，請檢查網路後再試一次。'), el('br'), retry);
      }
    }
  }

  // ===== 操作 =====
  // 切換類型：指示膠囊彈性滑動，列表依方向左右平移進場（和地圖頁切換地圖與列表同一種感覺）
  function setFilter(f) {
    if (f === store.filter) return;
    const dir = Math.sign(FILTERS.indexOf(f) - FILTERS.indexOf(store.filter));
    store.filter = f;
    $('filters').dataset.i = String(FILTERS.indexOf(f));
    $('filters').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.f === f)));
    render(); scrollToNext(false);
    // 平移距離不能超過頁面左右的留白（.wrap 的 padding，12px）：列表的任何一部分只要超出畫面，
    // iOS 就會暫時把版面視窗撐寬，底部固定的篩選列會跟著位移、掉出畫面幾幀。不超出就不會
    if (!reduceMotion()) $('list').animate([{ translate: dir * PAN_PX + 'px 0', opacity: 0 }, { translate: '0 0', opacity: 1 }], { duration: 420, easing: 'cubic-bezier(.22, 1, .36, 1)' });
  }
  $('filters').addEventListener('click', (e) => { const b = e.target.closest('button[data-f]'); if (b) setFilter(b.dataset.f); });
  setInterval(applyStates, 60e3);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) applyStates(); }); // 切回來時立刻更新

  // 摺疊動畫的備援：Safari（含 iPhone 的 LINE）不支援 interpolate-size，CSS 版本會直接跳開；改用 Web Animations 動畫高度。
  // 支援 interpolate-size 的瀏覽器（Chrome、Edge）完全走上面的 CSS，這段不會執行（和地圖頁同一套）
  const NEEDS_DETAILS_FALLBACK = !CSS.supports('interpolate-size', 'allow-keywords') || window.FORCE_DETAILS_FALLBACK;
  if (NEEDS_DETAILS_FALLBACK) {
    document.addEventListener('click', (e) => {
      const summary = e.target.closest('.more > summary');
      if (!summary || reduceMotion()) return;
      const details = summary.parentElement;
      const body = details.querySelector('.more-body');
      e.preventDefault();
      const wantOpen = !(details.dataset.want ? details.dataset.want === 'open' : details.open);
      const current = details.open ? body.getBoundingClientRect().height : 0;
      body.getAnimations().forEach((a) => a.cancel());
      details.dataset.want = wantOpen ? 'open' : 'closed';
      const run = (from, to, done) => {
        body.style.overflow = 'hidden';
        const anim = body.animate({ height: [from + 'px', to + 'px'] }, { duration: 320, easing: 'cubic-bezier(.22, 1, .36, 1)' });
        anim.addEventListener('finish', () => { body.style.overflow = ''; delete details.dataset.want; done?.(); });
        anim.addEventListener('cancel', () => { body.style.overflow = ''; });
      };
      if (wantOpen) { details.open = true; run(current, body.scrollHeight); }
      else run(current, 0, () => { details.open = false; });
    });
  }

  load();
</script>
</body>
</html>
